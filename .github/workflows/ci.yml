name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}

jobs:
  quality:
    name: Lint · typecheck · unit · pgTAP · integración
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm tsx scripts/lint-texts.ts
      - run: pnpm lint:design # REQ-078.1, 078.3, 078.14
      - run: pnpm test:coverage # unitarias + NFR-009 (100 % de ramas en el dominio)
      # Postgres 16 + pgTAP + pg_cron + shim de Supabase (ADR-015). La imagen supabase/postgres no
      # sirve: su usuario postgres no es superusuario y no deja instalar el shim en `auth`.
      - name: Base de pruebas (shim + migraciones + seed)
        run: scripts/ci-db.sh up
      - name: pgTAP
        run: scripts/ci-db.sh test
      - run: pnpm test:integration
      - run: pnpm tsx scripts/traceability.ts
      - run: pnpm build

  e2e:
    # REQ/NFR de punta a punta en Pixel 7 + iPhone 13 contra un Supabase LOCAL del CI (ADR-022):
    # las pruebas cambian datos (cancelan turnos, cierran la caja), nunca se corren contra producción.
    # Repartida en 4 partes en paralelo (T-010, 2026-11-10): cada parte levanta su propio Supabase
    # local, así que las pruebas siguen sin pisarse; baja de ~30 a ~10 min por corrida.
    name: E2E móvil · parte ${{ matrix.shard }} de 4
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local (migraciones + seed)
        run: supabase start -x imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Variables de la app desde supabase status
        run: |
          supabase status -o env > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "E2E_BASE_URL=http://localhost:3000"
            echo "DESIGN_SHOWCASE=1" # /diseno en el build de producción del CI (ui-components.spec)
            echo "TURNOS_MODULES=todos" # REQ-079.8: módulos apagados encendidos (build y servidor)
          } >> "$GITHUB_ENV"
      - run: pnpm build
      - name: Servidor de producción
        env:
          WHATSAPP_FAKE_CHANNEL: "1" # REQ-043.4: el aviso automático no sale a la red
        run: |
          pnpm start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/salud >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/salud
      - run: pnpm test:e2e --workers=1 --shard=${{ matrix.shard }}/4
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results

  e2e-result:
    # Un solo check con el nombre de siempre para la regla de protección de `main` (T-010): verde
    # solo si las 4 partes pasaron.
    name: E2E móvil (Pixel 7 + iPhone 13)
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - run: test "${{ needs.e2e.result }}" = "success"

  lighthouse:
    # NFR-001 / REQ-032.2: Lighthouse móvil (rendimiento ≥ 80, accesibilidad ≥ 90) en /[slug],
    # /t/[token] y /app/fila, sobre un build de producción contra un Supabase local del CI
    # (supabase start aplica migraciones + seed; no necesita secretos).
    name: Lighthouse móvil
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local (migraciones + seed)
        run: supabase start -x storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Variables de la app desde supabase status
        run: |
          supabase status -o env > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3100"
            echo "TURNOS_MODULES=todos" # REQ-079.8: Lighthouse mide con todo encendido (build y servidor)
          } >> "$GITHUB_ENV"
      - run: pnpm build
      - name: Servidor de producción
        run: |
          pnpm start -p 3100 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/salud >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3100/salud
      - run: pnpm lighthouse
        env:
          LH_BASE_URL: http://localhost:3100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouse
          include-hidden-files: true
