name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}

jobs:
  quality:
    name: Lint · typecheck · unit · pgTAP · integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.054
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm tsx scripts/lint-texts.ts
      - run: pnpm test:unit
      - name: "Migraciones + seed (imagen de Supabase con auth, realtime, pgtap, pg_cron)"
        run: |
          sudo apt-get install -y -qq postgresql-client libtap-parser-sourcehandler-pgtap-perl >/dev/null
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -p 54329 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/local/0000_supabase_shim.sql
          for m in supabase/migrations/*.sql; do psql -h 127.0.0.1 -p 54329 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$m"; done
          psql -h 127.0.0.1 -p 54329 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -h 127.0.0.1 -p 54329 -U postgres -d postgres -q -c "create extension if not exists pgtap;"
      - run: pg_prove -h 127.0.0.1 -p 54329 -U postgres -d postgres supabase/tests/*.sql
        env: { PGPASSWORD: postgres }
      - run: pnpm test:integration
      - run: pnpm tsx scripts/traceability.ts
      - run: pnpm build

  e2e:
    name: E2E móvil (requiere proyecto de Supabase)
    runs-on: ubuntu-latest
    needs: quality
    # `secrets` no se puede usar en el `if` de un job: se activa con la variable del repositorio
    # E2E_ENABLED=true (Settings → Secrets and variables → Actions → Variables) cuando existan los
    # secretos del proyecto de Supabase.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
